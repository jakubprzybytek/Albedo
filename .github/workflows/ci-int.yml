name: CI Main Int

on:
  push:
    branches: [ main ]

  workflow_dispatch:

concurrency: 
  group: main-int
  cancel-in-progress: false

env:
  STAGE: int
  AWS_DEFAULT_REGION: eu-west-1

jobs:

  deploy:
    runs-on: ubuntu-latest

    name: Deploy Int

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: bahmutov/npm-install@v1

      - name: Run unit tests
        run: npm test

      - name: Run type checks
        run: npm run typecheck

      - name: Verify SST version
        run: test "$(npx sst version)" = "4.17.1"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{env.AWS_DEFAULT_REGION}}

      - name: Run Serverless Stack deploy
        run: npm run deploy -- --stage ${STAGE}

      - name: Install Playwright Browsers
        run: npm exec playwright install chromium --with-deps --prefix packages/web

      - name: Run E2E tests
        run: npm run test:e2e --prefix packages/web
        env:
          CI: true
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_BASE_URL: https://albedoonline.com