name: CI Main Int

on:
  push:
    branches: [ main ]

  workflow_dispatch:

concurrency: 
  group: main-int
  cancel-in-progress: false

permissions:
  contents: read

env:
  STAGE: int

jobs:

  deploy:
    runs-on: ubuntu-latest

    name: Deploy Int

    permissions:
      contents: read
      id-token: write # OIDC → AWS (agent-playbook/aws-github-deploy)

    steps:
      - uses: actions/checkout@v6

      # Vitest 5 needs Node 22.12+; don't depend on the runner image's default.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        uses: bahmutov/npm-install@v1

      - name: Run unit tests
        run: npm test

      - name: Generate SST types
        run: npx sst install

      - name: Run type checks
        run: npm run typecheck

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHub-Albedo
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-albedo-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Run Serverless Stack deploy
        run: npm run deploy -- --stage ${STAGE}

      - name: Install Playwright Browsers
        run: npm exec playwright install chromium --with-deps --prefix packages/web

      - name: Run E2E tests
        run: npm run test:e2e --prefix packages/web
        env:
          CI: true
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_BASE_URL: https://albedoonline.com