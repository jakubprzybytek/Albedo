name: CI Main Int

on:
  push:
    branches: [ main ]

  workflow_dispatch:

concurrency: 
  group: main-int
  cancel-in-progress: false

permissions:
  id-token: write # OIDC → AWS
  contents: read

env:
  STAGE: int
  AWS_DEFAULT_REGION: eu-west-1
  AWS_ROLE: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/GitHub-Albedo # account number: repository secret (masked in logs)

jobs:

  deploy:
    runs-on: ubuntu-latest

    name: Deploy Int

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: bahmutov/npm-install@v1

      - name: Run unit tests
        run: npm test

      - name: Generate SST types
        run: npx sst install

      - name: Run type checks
        run: npm run typecheck

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{env.AWS_DEFAULT_REGION}}

      - name: Run Serverless Stack deploy
        run: npm run deploy -- --stage ${STAGE}

      - name: Install Playwright Browsers
        run: npm exec playwright install chromium --with-deps --prefix packages/web

      - name: Run E2E tests
        run: npm run test:e2e --prefix packages/web
        env:
          CI: true
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_BASE_URL: https://albedoonline.com